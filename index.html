<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة تحليل البيانات الذكية | Data Analysis Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; }
    @media print {
      .no-print { display: none !important; }
      body { background: white; color: black; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-teal-500 selection:text-white">
  <div id="root"></div>

  <script>
    const e = React.createElement;
    const { useState, useEffect, useMemo, useRef } = React;

    // ---------- أدوات مساعدة ومحرك الإحصاء ----------
    function parseArabicNumber(val) {
      if (typeof val === 'number') return val;
      if (!val) return NaN;
      const str = String(val)
        .replace(/[٠١٢٣٤٥٦٧٨٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
        .replace(/٫/g, '.').replace(/,/g, '').trim();
      return parseFloat(str);
    }

    function detectType(values) {
      const nonNulls = values.filter(v => v !== null && v !== undefined && String(v).trim() !== '');
      if (nonNulls.length === 0) return 'string';
      let numCount = 0, dateCount = 0, boolCount = 0;
      nonNulls.forEach(v => {
        const n = parseArabicNumber(v);
        if (!isNaN(n)) numCount++;
        const d = new Date(v);
        if (!isNaN(d.getTime()) && String(v).length > 4 && /[/-]/.test(String(v))) dateCount++;
        if (typeof v === 'boolean' || ['true', 'false', 'نعم', 'لا'].includes(String(v).toLowerCase())) boolCount++;
      });
      const total = nonNulls.length;
      if (numCount / total > 0.75) return 'number';
      if (dateCount / total > 0.75) return 'date';
      if (boolCount / total > 0.75) return 'boolean';
      return 'string';
    }

    function calculateStats(numbers) {
      const valid = numbers.map(parseArabicNumber).filter(v => !isNaN(v));
      if (valid.length === 0) return null;
      const n = valid.length;
      const sum = valid.reduce((a, b) => a + b, 0);
      const mean = sum / n;
      const sorted = [...valid].sort((a, b) => a - b);
      const min = sorted[0], max = sorted[n - 1];
      const mid = Math.floor(n / 2);
      const median = n % 2 === 0 ? (sorted[mid - 1] + sorted[mid]) / 2 : sorted[mid];
      const q1 = sorted[Math.floor(n * 0.25)];
      const q3 = sorted[Math.floor(n * 0.75)];
      const iqr = q3 - q1;
      const variance = valid.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n > 1 ? n - 1 : 1);
      const stdDev = Math.sqrt(variance);
      const freq = {};
      let maxFreq = 0, mode = sorted[0];
      valid.forEach(v => {
        freq[v] = (freq[v] || 0) + 1;
        if (freq[v] > maxFreq) { maxFreq = freq[v]; mode = v; }
      });
      const lower = q1 - 1.5 * iqr, upper = q3 + 1.5 * iqr;
      const outliersCount = valid.filter(v => v < lower || v > upper).length;
      return { n, sum, mean, median, min, max, q1, q3, iqr, variance, stdDev, mode, outliersCount };
    }

    function processRawDataset(fileName, rawData) {
      const rowCount = rawData.length;
      if (rowCount === 0) return null;
      const cols = Object.keys(rawData[0] || {});
      let totalMissing = 0;
      const seenRows = new Set();
      let duplicatesCount = 0;
      rawData.forEach(row => {
        const str = JSON.stringify(row);
        if (seenRows.has(str)) duplicatesCount++; else seenRows.add(str);
      });
      const columnsInfo = cols.map(colName => {
        const values = rawData.map(r => r[colName]);
        const missingCount = values.filter(v => v === null || v === undefined || String(v).trim() === '').length;
        totalMissing += missingCount;
        const uniqueVals = new Set(values.filter(v => v !== null && v !== undefined && String(v).trim() !== ''));
        const type = detectType(values);
        return { name: colName, type, missingCount, uniqueCount: uniqueVals.size, stats: type === 'number' ? calculateStats(values) : null };
      });
      const totalCells = rowCount * cols.length;
      const qualityScore = totalCells > 0 ? Math.max(0, Math.round(100 - ((totalMissing + duplicatesCount * cols.length) / totalCells) * 100)) : 100;
      return {
        id: 'ds_' + Math.random().toString(36).substring(2, 9),
        name: fileName, fileName, rowCount, columnCount: cols.length,
        columns: columnsInfo, data: rawData, qualityScore, duplicatesCount, totalMissing
      };
    }

    // ---------- منطق الدمج والربط (مستقل عن الواجهة) ----------
    const MERGE_TYPES = [
      { id: 'append', title: 'إلحاق (Append)', desc: 'وضع صفوف الملف الثاني أسفل الأول، وتُدمج الأعمدة المتشابهة بالاسم.' },
      { id: 'inner', title: 'ربط داخلي (Inner)', desc: 'الصفوف المتطابقة في عمود الربط بين الملفين فقط.' },
      { id: 'left', title: 'ربط يساري (Left)', desc: 'كل صفوف الملف الأول + المطابق لها من الثاني.' },
      { id: 'right', title: 'ربط يميني (Right)', desc: 'كل صفوف الملف الثاني + المطابق لها من الأول.' },
      { id: 'full', title: 'ربط كامل (Full)', desc: 'كل الصفوف من الملفين سواء تطابقت أو لا.' }
    ];

    function stripExt(n) { return String(n).replace(/\.(xlsx|xls|csv)$/i, ''); }
    function normKey(v) { return v === null || v === undefined ? '' : String(v).trim().toLowerCase(); }

    function suggestKeys(d1, d2) {
      const common = d1.columns.find(c => d2.columns.some(x => x.name === c.name));
      return common ? [common.name, common.name] : [d1.columns[0].name, d2.columns[0].name];
    }

    function mergeDatasets(d1, d2, type, key1, key2) {
      const cols1 = d1.columns.map(c => c.name);
      const cols2 = d2.columns.map(c => c.name);

      if (type === 'append') {
        const all = [...cols1, ...cols2.filter(c => !cols1.includes(c))];
        return [...d1.data, ...d2.data].map(r => {
          const o = {};
          all.forEach(c => { o[c] = r[c] === undefined ? null : r[c]; });
          return o;
        });
      }

      const sharedKey = key1 === key2;
      const renamed = {};
      cols2.forEach(c => { renamed[c] = cols1.includes(c) ? `${c} (2)` : c; });
      if (sharedKey) renamed[key2] = key1;

      const blank1 = {}; cols1.forEach(c => { blank1[c] = null; });
      const blank2 = {};
      cols2.forEach(c => { if (!(sharedKey && c === key2)) blank2[renamed[c]] = null; });

      const mapRow2 = (m) => {
        const o = {};
        cols2.forEach(c => { if (!(sharedKey && c === key2)) o[renamed[c]] = m[c] === undefined ? null : m[c]; });
        return o;
      };

      const index2 = new Map();
      d2.data.forEach((r, i) => {
        const k = normKey(r[key2]);
        if (k === '') return;
        if (!index2.has(k)) index2.set(k, []);
        index2.get(k).push(i);
      });

      const out = [];
      const matched2 = new Set();

      d1.data.forEach(r1 => {
        const k = normKey(r1[key1]);
        const hits = k !== '' ? index2.get(k) : null;
        if (hits && hits.length) {
          hits.forEach(i => { matched2.add(i); out.push({ ...r1, ...mapRow2(d2.data[i]) }); });
        } else if (type === 'left' || type === 'full') {
          out.push({ ...r1, ...blank2 });
        }
      });

      if (type === 'right' || type === 'full') {
        d2.data.forEach((r2, i) => {
          if (matched2.has(i)) return;
          const row = { ...blank1, ...mapRow2(r2) };
          if (sharedKey) row[key1] = r2[key2];
          out.push(row);
        });
      }
      return out;
    }

    // ---------- بيانات تجريبية ----------
    function generateDemoDataset() {
      const regions = ['الرياض', 'جدة', 'الدمام', 'مكة المكرمة', 'المدينة المنورة'];
      const categories = ['إلكترونيات', 'مستلزمات مكتبية', 'أثاث', 'خدمات صحية'];
      const demoData = [];
      for (let i = 1; i <= 150; i++) {
        const sales = Math.floor(Math.random() * 8000) + 1200;
        const profit = Math.floor(sales * (Math.random() * 0.35 + 0.05));
        const region = i % 15 === 0 ? null : regions[Math.floor(Math.random() * regions.length)];
        const date = new Date(2025, Math.floor(Math.random() * 12), Math.floor(Math.random() * 28) + 1).toISOString().split('T')[0];
        demoData.push({
          'معرف العملية': `TRX-${1000 + i}`, 'التاريخ': date, 'المنطقة': region,
          'الفئة': categories[Math.floor(Math.random() * categories.length)],
          'المبيعات (SAR)': sales, 'الربح (SAR)': profit, 'عدد الوحدات': Math.floor(Math.random() * 20) + 1
        });
      }
      demoData.push({ ...demoData[0] });
      return processRawDataset('عينة_المبيعات_التجريبية.xlsx', demoData);
    }

    // ---------- التطبيق الرئيسي ----------
    function App() {
      const [datasets, setDatasets] = useState([]);
      const [activeDatasetId, setActiveDatasetId] = useState(null);
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [isLoading, setIsLoading] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');

      const [chartType, setChartType] = useState('bar');
      const [xAxisCol, setXAxisCol] = useState('');
      const [yAxisCol, setYAxisCol] = useState('');

      const [showMergeModal, setShowMergeModal] = useState(false);
      const [mergeType, setMergeType] = useState('append');
      const [ds1Id, setDs1Id] = useState('');
      const [ds2Id, setDs2Id] = useState('');
      const [joinKey, setJoinKey] = useState('');
      const [joinKey2, setJoinKey2] = useState('');

      const activeDataset = useMemo(
        () => datasets.find(d => d.id === activeDatasetId) || datasets[0] || null,
        [datasets, activeDatasetId]
      );

      useEffect(() => {
        if (activeDataset) {
          const cat = activeDataset.columns.find(c => c.type === 'string' || c.type === 'date');
          const num = activeDataset.columns.find(c => c.type === 'number');
          setXAxisCol(cat ? cat.name : (activeDataset.columns[0] ? activeDataset.columns[0].name : ''));
          setYAxisCol(num ? num.name : '');
        }
      }, [activeDataset && activeDataset.id]);

      // رفع الملفات (يضيف إلى الملفات الموجودة)
      const handleFileUpload = async (files) => {
        setIsLoading(true);
        const newDatasets = [];
        for (const file of files) {
          const ext = file.name.split('.').pop().toLowerCase();
          try {
            if (ext === 'csv') {
              const text = await file.text();
              const parsed = Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true });
              if (parsed.data && parsed.data.length > 0) {
                const ds = processRawDataset(file.name, parsed.data);
                if (ds) newDatasets.push(ds);
              }
            } else if (['xlsx', 'xls'].includes(ext)) {
              const buffer = await file.arrayBuffer();
              const wb = XLSX.read(buffer, { type: 'array' });
              wb.SheetNames.forEach(sheetName => {
                const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: null });
                if (raw.length > 0) {
                  const dsName = wb.SheetNames.length > 1 ? `${file.name} (${sheetName})` : file.name;
                  const ds = processRawDataset(dsName, raw);
                  if (ds) newDatasets.push(ds);
                }
              });
            }
          } catch (err) {
            console.error('File reading error:', err);
            alert(`فشل قراءة الملف: ${file.name}`);
          }
        }
        if (newDatasets.length > 0) {
          setDatasets(prev => [...prev, ...newDatasets]);
          setActiveDatasetId(newDatasets[0].id);
        }
        setIsLoading(false);
      };

      const uploadInput = () => e('input', {
        type: 'file', multiple: true, accept: '.xlsx,.xls,.csv', className: 'hidden',
        onChange: (ev) => {
          const files = Array.from(ev.target.files || []);
          ev.target.value = '';
          if (files.length) handleFileUpload(files);
        }
      });

      const handleLoadDemo = () => {
        const demo = generateDemoDataset();
        setDatasets([demo]);
        setActiveDatasetId(demo.id);
      };

      // تنظيف البيانات
      const handleCleanData = (options) => {
        if (!activeDataset) return;
        let cleaned = [...activeDataset.data];
        if (options.removeDuplicates) {
          const seen = new Set();
          cleaned = cleaned.filter(row => {
            const str = JSON.stringify(row);
            if (seen.has(str)) return false;
            seen.add(str);
            return true;
          });
        }
        if (options.handleMissing) {
          cleaned = cleaned.map(row => {
            const newRow = { ...row };
            activeDataset.columns.forEach(col => {
              const v = newRow[col.name];
              if (v === null || v === undefined || String(v).trim() === '') {
                if (col.type === 'number' && col.stats) newRow[col.name] = Number(col.stats.mean.toFixed(2));
                else if (col.type === 'string') newRow[col.name] = 'غير محدد';
              }
            });
            return newRow;
          });
        }
        const updatedDS = processRawDataset(activeDataset.fileName, cleaned);
        setDatasets(prev => prev.map(d => d.id === activeDataset.id ? updatedDS : d));
        setActiveDatasetId(updatedDS.id);
        alert('تم تطبيق تنظيف البيانات وإعادة حساب المقاييس الإحصائية بنجاح!');
      };

      // ---------- الدمج والربط ----------
      const resolvePair = () => {
        const d1 = datasets.find(d => d.id === ds1Id) || datasets[0];
        const d2 = datasets.find(d => d.id === ds2Id && d !== d1) || datasets.find(d => d !== d1) || null;
        if (!d1 || !d2) return { d1, d2, k1: '', k2: '' };
        const sug = suggestKeys(d1, d2);
        const k1 = d1.columns.some(c => c.name === joinKey) ? joinKey : sug[0];
        const k2 = d2.columns.some(c => c.name === joinKey2) ? joinKey2 : sug[1];
        return { d1, d2, k1, k2 };
      };

      const openMergeModal = () => {
        const d1 = activeDataset || datasets[0];
        const d2 = datasets.find(d => d !== d1);
        setDs1Id(d1 ? d1.id : '');
        setDs2Id(d2 ? d2.id : '');
        if (d1 && d2) {
          const [a, b] = suggestKeys(d1, d2);
          setJoinKey(a); setJoinKey2(b);
        }
        setMergeType('append');
        setShowMergeModal(true);
      };

      const handleExecuteMerge = () => {
        const { d1, d2, k1, k2 } = resolvePair();
        if (!d1 || !d2) { alert('يرجى اختيار ملفين مختلفين للدمج.'); return; }
        if (mergeType !== 'append' && (!k1 || !k2)) { alert('يرجى اختيار عمود الربط في كل ملف.'); return; }

        const merged = mergeDatasets(d1, d2, mergeType, k1, k2);
        if (merged.length === 0) {
          alert('لا توجد صفوف متطابقة بين الملفين حسب عمود الربط المختار. جرّب نوع ربط آخر أو عمودًا مختلفًا.');
          return;
        }
        const prefix = { append: 'إلحاق', inner: 'ربط_داخلي', left: 'ربط_يساري', right: 'ربط_يميني', full: 'ربط_كامل' }[mergeType];
        const newDs = processRawDataset(`${prefix}_${stripExt(d1.name)}_${stripExt(d2.name)}.xlsx`, merged);
        if (!newDs) { alert('تعذر إنشاء مجموعة البيانات المدمجة.'); return; }

        setDatasets(prev => [...prev, newDs]);
        setActiveDatasetId(newDs.id);
        setCurrentTab('dashboard');
        setSearchTerm('');
        setShowMergeModal(false);
        alert(`تم الدمج بنجاح: ${newDs.rowCount.toLocaleString('ar-SA')} صف و${newDs.columnCount} عمود. الملف الجديد أصبح هو الملف النشط.`);
      };

      const renderMergeModal = () => {
        const close = () => setShowMergeModal(false);
        const { d1, d2, k1, k2 } = resolvePair();
        const isJoin = mergeType !== 'append';
        const selCls = 'w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm';
        const lblCls = 'block text-xs font-bold text-slate-600 mb-1';
        const fileOptions = datasets.map(d => e('option', { key: d.id, value: d.id }, `${d.fileName} (${d.rowCount} صف)`));
        const colOptions = (ds) => ds.columns.map(c => e('option', { key: c.name, value: c.name }, c.name));

        let body;
        if (datasets.length < 2 || !d2) {
          body = e('div', { className: 'space-y-4 text-center py-4' },
            e('p', { className: 'text-slate-700 text-sm' }, 'تحتاج إلى ملفين على الأقل لإجراء الدمج أو الربط. أضف ملفًا آخر الآن:'),
            e('label', { className: 'inline-flex items-center gap-2 bg-teal-600 hover:bg-teal-700 text-white px-5 py-2.5 rounded-xl font-semibold text-sm cursor-pointer' },
              e('span', null, 'إضافة ملف آخر'), uploadInput()),
            isLoading && e('p', { className: 'text-xs text-slate-500' }, 'جاري قراءة الملف...')
          );
        } else {
          body = e('div', { className: 'space-y-5' },
            e('div', null,
              e('label', { className: lblCls }, 'نوع العملية'),
              e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-2' },
                MERGE_TYPES.map(t => e('button', {
                  key: t.id, type: 'button', onClick: () => setMergeType(t.id),
                  className: `text-right p-3 rounded-xl border text-xs transition ${mergeType === t.id ? 'border-teal-600 bg-teal-50 ring-1 ring-teal-600' : 'border-slate-200 hover:border-slate-400 bg-white'}`
                }, e('span', { className: 'block font-bold text-slate-800 text-sm mb-0.5' }, t.title), e('span', { className: 'text-slate-500' }, t.desc)))
              )
            ),
            e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-3' },
              e('div', null, e('label', { className: lblCls }, 'الملف الأول'),
                e('select', { className: selCls, value: d1.id, onChange: (ev) => setDs1Id(ev.target.value) }, fileOptions)),
              e('div', null, e('label', { className: lblCls }, 'الملف الثاني'),
                e('select', { className: selCls, value: d2.id, onChange: (ev) => setDs2Id(ev.target.value) }, fileOptions))
            ),
            d1.id === d2.id && e('p', { className: 'text-xs text-amber-600 font-semibold' }, 'اختر ملفين مختلفين.'),
            isJoin && e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-3' },
              e('div', null, e('label', { className: lblCls }, 'عمود الربط في الملف الأول'),
                e('select', { className: selCls, value: k1, onChange: (ev) => setJoinKey(ev.target.value) }, colOptions(d1))),
              e('div', null, e('label', { className: lblCls }, 'عمود الربط في الملف الثاني'),
                e('select', { className: selCls, value: k2, onChange: (ev) => setJoinKey2(ev.target.value) }, colOptions(d2)))
            ),
            e('p', { className: 'text-xs text-slate-500 bg-slate-50 rounded-lg p-3 border border-slate-100' },
              isJoin
                ? 'المطابقة لا تفرّق بين الحروف الكبيرة والصغيرة ولا المسافات الزائدة. الأعمدة المكررة بالاسم من الملف الثاني تُضاف باللاحقة (2).'
                : `الناتج المتوقع: ${(d1.rowCount + d2.rowCount).toLocaleString('ar-SA')} صف. الأعمدة غير المشتركة تُملأ بقيم فارغة.`),
            e('div', { className: 'flex gap-3 pt-2' },
              e('button', {
                type: 'button', onClick: handleExecuteMerge, disabled: d1.id === d2.id,
                className: 'flex-1 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-2.5 rounded-xl transition'
              }, 'تنفيذ الدمج'),
              e('button', { type: 'button', onClick: close, className: 'px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-semibold hover:bg-slate-50' }, 'إلغاء')
            )
          );
        }

        return e('div', { key: 'merge-modal', className: 'fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4 no-print', onClick: close },
          e('div', { className: 'bg-white rounded-2xl shadow-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto p-6 space-y-5', onClick: (ev) => ev.stopPropagation() },
            e('div', { className: 'flex items-center justify-between border-b border-slate-100 pb-3' },
              e('h3', { className: 'text-lg font-bold text-slate-900' }, 'دمج / ربط الملفات'),
              e('button', { type: 'button', onClick: close, className: 'text-slate-400 hover:text-slate-700 text-xl leading-none' }, '✕')
            ),
            body
          )
        );
      };

      // ---------- التصفية والرسم ----------
      const filteredRows = useMemo(() => {
        if (!activeDataset) return [];
        if (!searchTerm) return activeDataset.data;
        const q = searchTerm.toLowerCase();
        return activeDataset.data.filter(row => Object.values(row).some(val => String(val === null || val === undefined ? '' : val).toLowerCase().includes(q)));
      }, [activeDataset, searchTerm]);

      const chartData = useMemo(() => {
        if (!activeDataset || !xAxisCol || !yAxisCol) return [];
        const groups = {};
        filteredRows.forEach(row => {
          const xVal = String(row[xAxisCol] === null || row[xAxisCol] === undefined ? 'غير محدد' : row[xAxisCol]);
          const yVal = parseArabicNumber(row[yAxisCol]) || 0;
          groups[xVal] = (groups[xVal] || 0) + yVal;
        });
        return Object.entries(groups)
          .map(([label, val]) => ({ label, val: Number(val.toFixed(2)) }))
          .sort((a, b) => b.val - a.val)
          .slice(0, 15);
      }, [activeDataset, filteredRows, xAxisCol, yAxisCol]);

      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (chartInstanceRef.current) { chartInstanceRef.current.destroy(); chartInstanceRef.current = null; }
        if (currentTab === 'dashboard' && chartRef.current && chartData.length > 0) {
          chartInstanceRef.current = new Chart(chartRef.current.getContext('2d'), {
            type: chartType === 'donut' ? 'doughnut' : chartType,
            data: {
              labels: chartData.map(d => d.label),
              datasets: [{
                label: `${yAxisCol} حسب ${xAxisCol}`,
                data: chartData.map(d => d.val),
                backgroundColor: ['#0d9488', '#6366f1', '#f59e0b', '#ec4899', '#3b82f6', '#10b981', '#8b5cf6'],
                borderWidth: 1
              }]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { font: { family: 'Cairo' } } } }
            }
          });
        }
      }, [chartData, chartType, currentTab, activeDataset && activeDataset.id]);

      // ---------- التصدير ----------
      const handleExportExcel = () => {
        if (!activeDataset) return;
        const ws = XLSX.utils.json_to_sheet(activeDataset.data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'البيانات');
        XLSX.writeFile(wb, `مستخرج_${stripExt(activeDataset.fileName)}.xlsx`);
      };

      const handleExportCSV = () => {
        if (!activeDataset) return;
        const csv = Papa.unparse(activeDataset.data);
        const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `مستخرج_${stripExt(activeDataset.name)}.csv`;
        link.click();
      };

      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

      const icon = (name, cls) => e('i', { 'data-lucide': name, className: cls });
      const th = (t, k) => e('th', { key: k || t, className: 'p-3' }, t);

      return e('div', { className: 'min-h-screen flex flex-col font-cairo' },
        // Header
        e('header', { className: 'bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md no-print' },
          e('div', { className: 'max-w-7xl mx-auto px-4 h-16 flex items-center justify-between' },
            e('div', { className: 'flex items-center gap-3' },
              e('div', { className: 'bg-teal-600 p-2.5 rounded-xl flex items-center justify-center' }, icon('bar-chart-3', 'w-6 h-6 text-white')),
              e('div', null,
                e('h1', { className: 'text-lg font-bold' }, 'منصة تحليل البيانات الذكية'),
                e('p', { className: 'text-xs text-slate-400' }, 'Data Analysis Studio • نظام التحليل المستقل')
              )
            ),
            e('div', { className: 'flex items-center gap-2 sm:gap-3' },
              datasets.length > 0 && e('label', { className: 'flex items-center gap-1.5 bg-teal-600 hover:bg-teal-700 px-3.5 py-2 rounded-lg text-sm font-semibold transition cursor-pointer' },
                e('span', null, '+ إضافة ملفات'), uploadInput()),
              datasets.length > 0 && e('button', {
                onClick: openMergeModal,
                className: 'flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 px-3.5 py-2 rounded-lg text-sm font-semibold transition'
              }, icon('git-merge', 'w-4 h-4'), e('span', null, 'دمج / ربط الملفات')),
              datasets.length > 0 && e('button', {
                onClick: () => { setDatasets([]); setActiveDatasetId(null); setShowMergeModal(false); },
                className: 'flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg text-sm font-medium border border-slate-700'
              }, icon('refresh-cw', 'w-4 h-4'), e('span', null, 'إعادة ضبط'))
            )
          )
        ),

        showMergeModal && renderMergeModal(),

        e('main', { className: 'flex-1 pb-12' },
          datasets.length === 0 ?
            e('div', { className: 'max-w-3xl mx-auto py-12 px-4' },
              e('div', { className: 'text-center mb-8' },
                e('h2', { className: 'text-3xl font-extrabold text-slate-900 mb-3' }, 'حلل بياناتك بضغطة زر واحدة محلياً 100%'),
                e('p', { className: 'text-slate-600 text-base' }, 'قم برفع ملفات Excel أو CSV للبدء التلقائي بالتنظيف والإحصاء المتقدم والتقارير التنفيذية.')
              ),
              e('label', { className: 'border-2 border-dashed border-slate-300 hover:border-teal-500 rounded-2xl p-10 block text-center bg-white cursor-pointer shadow-sm transition' },
                e('div', { className: 'w-16 h-16 bg-teal-50 text-teal-600 rounded-2xl flex items-center justify-center mx-auto mb-4' }, icon('file-spreadsheet', 'w-8 h-8')),
                e('h3', { className: 'text-xl font-bold text-slate-800 mb-2' }, 'اختر الملفات أو اسحبها هنا'),
                e('p', { className: 'text-slate-500 mb-6 text-sm' }, 'يدعم ملفات Excel (.xlsx, .xls) وملفات CSV (.csv) متعددة'),
                e('span', { className: 'inline-flex items-center gap-2 bg-teal-600 hover:bg-teal-700 text-white px-6 py-3 rounded-xl font-semibold shadow-lg shadow-teal-600/20' },
                  icon('upload', 'w-5 h-5'), e('span', null, 'استعراض الجهاز')),
                uploadInput()
              ),
              e('div', { className: 'mt-6 text-center' },
                e('button', { onClick: handleLoadDemo, className: 'inline-flex items-center gap-2 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-4 py-2 rounded-xl text-sm font-bold transition' },
                  icon('sparkles', 'w-4 h-4'), e('span', null, 'تحميل عينة تجريبية لتجربة فورية'))
              ),
              isLoading && e('div', { className: 'mt-6 text-center bg-white p-6 rounded-xl border border-slate-200' },
                e('div', { className: 'inline-block animate-spin rounded-full h-8 w-8 border-4 border-teal-600 border-t-transparent mb-2' }),
                e('p', { className: 'font-semibold text-slate-800' }, 'جاري فحص البيانات وبناء الهياكل الإحصائية...')
              )
            )
          :
            e('div', null,
              // Dataset switcher
              e('div', { className: 'bg-slate-900 text-slate-300 border-b border-slate-800 no-print' },
                e('div', { className: 'max-w-7xl mx-auto px-4 flex items-center gap-2 overflow-x-auto py-2' },
                  e('span', { className: 'text-xs font-bold text-slate-400 shrink-0' }, 'الملفات النشطة:'),
                  datasets.map(ds => e('button', {
                    key: ds.id, onClick: () => setActiveDatasetId(ds.id),
                    className: `flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0 transition ${ds.id === activeDataset.id ? 'bg-teal-600 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'}`
                  }, e('span', null, ds.fileName)))
                )
              ),

              // Tabs
              e('div', { className: 'bg-white border-b border-slate-200 mb-6 no-print' },
                e('div', { className: 'max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto' },
                  [
                    { id: 'dashboard', label: 'لوحة التحليل والتفاعل', icon: 'layout-dashboard' },
                    { id: 'cleaner', label: 'تنظيف وجودة البيانات', icon: 'sliders' },
                    { id: 'report', label: 'التقرير التنفيذي الشامل', icon: 'file-spreadsheet' }
                  ].map(tab => e('button', {
                    key: tab.id, onClick: () => setCurrentTab(tab.id),
                    className: `flex items-center gap-2 py-4 px-5 font-semibold text-sm border-b-2 transition shrink-0 ${currentTab === tab.id ? 'border-teal-600 text-teal-600 bg-teal-50/50' : 'border-transparent text-slate-600 hover:text-slate-900'}`
                  }, e('span', null, tab.label)))
                )
              ),

              e('div', { className: 'max-w-7xl mx-auto px-4' },
                // TAB 1: Dashboard
                currentTab === 'dashboard' && e('div', { className: 'space-y-6' },
                  e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4' },
                    [
                      { title: 'إجمالي السجلات', val: activeDataset.rowCount.toLocaleString('ar-SA'), color: 'text-teal-600' },
                      { title: 'عدد الأعمدة', val: activeDataset.columnCount, color: 'text-indigo-600' },
                      { title: 'مؤشر الجودة', val: `${activeDataset.qualityScore}%`, color: 'text-emerald-600' },
                      { title: 'القيم المفقودة', val: activeDataset.totalMissing.toLocaleString('ar-SA'), color: 'text-amber-600' }
                    ].map((kpi, idx) => e('div', { key: idx, className: 'bg-white p-5 rounded-2xl border border-slate-200 shadow-sm' },
                      e('p', { className: 'text-xs font-medium text-slate-500 mb-1' }, kpi.title),
                      e('h3', { className: `text-2xl font-extrabold ${kpi.color}` }, kpi.val)
                    ))
                  ),

                  e('div', { className: 'bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4' },
                    e('div', { className: 'flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-4' },
                      e('h3', { className: 'font-bold text-slate-900 text-base' }, 'المحرك البياني التفاعلي'),
                      e('div', { className: 'flex flex-wrap items-center gap-3' },
                        e('select', { value: xAxisCol, onChange: (ev) => setXAxisCol(ev.target.value), className: 'bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-semibold' },
                          activeDataset.columns.map(c => e('option', { key: c.name, value: c.name }, `المحور الأفقي: ${c.name}`))),
                        e('select', { value: yAxisCol, onChange: (ev) => setYAxisCol(ev.target.value), className: 'bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-semibold' },
                          activeDataset.columns.filter(c => c.type === 'number').map(c => e('option', { key: c.name, value: c.name }, `المحور الرأسي: ${c.name}`))),
                        e('select', { value: chartType, onChange: (ev) => setChartType(ev.target.value), className: 'bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-semibold' },
                          e('option', { value: 'bar' }, 'شريطي العمودي'),
                          e('option', { value: 'line' }, 'خطي (التطور الزمني)'),
                          e('option', { value: 'pie' }, 'دائري (Pie)'),
                          e('option', { value: 'donut' }, 'حلقي (Donut)'))
                      )
                    ),
                    chartData.length === 0
                      ? e('p', { className: 'text-sm text-slate-500 text-center py-16' }, 'لا توجد أعمدة رقمية لرسمها في هذا الملف.')
                      : e('div', { className: 'h-80 relative' }, e('canvas', { ref: chartRef }))
                  ),

                  e('div', { className: 'bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden' },
                    e('div', { className: 'p-4 border-b border-slate-200 flex items-center justify-between gap-4' },
                      e('h3', { className: 'font-bold text-slate-900 text-sm' }, `استعراض البيانات (${filteredRows.length.toLocaleString('ar-SA')} صف، أول 50 معروضة)`),
                      e('input', { type: 'text', placeholder: 'بحث في البيانات...', value: searchTerm, onChange: (ev) => setSearchTerm(ev.target.value), className: 'bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs w-64' })
                    ),
                    e('div', { className: 'overflow-x-auto max-h-80' },
                      e('table', { className: 'w-full text-right border-collapse text-xs' },
                        e('thead', { className: 'bg-slate-50 font-bold sticky top-0 border-b border-slate-200 text-slate-700' },
                          e('tr', null, th('#', '#'), ...activeDataset.columns.map(c => th(c.name)))),
                        e('tbody', { className: 'divide-y divide-slate-100 text-slate-700' },
                          filteredRows.slice(0, 50).map((row, rIdx) => e('tr', { key: rIdx, className: 'hover:bg-slate-50' },
                            e('td', { className: 'p-3 text-slate-400 font-mono' }, rIdx + 1),
                            ...activeDataset.columns.map(c => e('td', { key: c.name, className: 'p-3 max-w-xs truncate' }, String(row[c.name] === null || row[c.name] === undefined ? '-' : row[c.name])))
                          ))
                        )
                      )
                    )
                  )
                ),

                // TAB 2: Cleaner
                currentTab === 'cleaner' && e('div', { className: 'max-w-3xl mx-auto bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6' },
                  e('h3', { className: 'text-lg font-bold text-slate-900 border-b border-slate-100 pb-3' }, 'خيارات تنظيف البيانات وإعادة التحليل'),
                  e('div', { className: 'space-y-4' },
                    e('label', { className: 'flex items-center gap-3 p-4 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer' },
                      e('input', { type: 'checkbox', defaultChecked: true, id: 'chk_dup', className: 'w-5 h-5 text-teal-600 rounded' }),
                      e('div', null,
                        e('span', { className: 'font-bold text-slate-800 text-sm block' }, 'حذف الصفوف المكررة تماماً'),
                        e('span', { className: 'text-xs text-slate-500' }, `تم رصد ${activeDataset.duplicatesCount} صفوف مكررة في البيانات الحالية.`))),
                    e('label', { className: 'flex items-center gap-3 p-4 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer' },
                      e('input', { type: 'checkbox', defaultChecked: true, id: 'chk_miss', className: 'w-5 h-5 text-teal-600 rounded' }),
                      e('div', null,
                        e('span', { className: 'font-bold text-slate-800 text-sm block' }, 'معالجة القيم الفارغة بالمعدلات الإحصائية'),
                        e('span', { className: 'text-xs text-slate-500' }, 'استبدال الفراغات بالأرقام بـ (Mean) وفي النصوص بـ ("غير محدد").')))
                  ),
                  e('button', {
                    onClick: () => handleCleanData({
                      removeDuplicates: document.getElementById('chk_dup').checked,
                      handleMissing: document.getElementById('chk_miss').checked
                    }),
                    className: 'w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-teal-600/20'
                  }, 'تطبيق المعالجة وتحديث الإحصائيات')
                ),

                // TAB 3: Report
                currentTab === 'report' && e('div', { className: 'max-w-4xl mx-auto space-y-6' },
                  e('div', { className: 'flex flex-wrap gap-3 justify-between items-center bg-white p-4 rounded-xl border border-slate-200 no-print' },
                    e('span', { className: 'text-sm font-bold text-slate-700' }, 'التقرير الشامل جاهز للتصدير أو الطباعة'),
                    e('div', { className: 'flex gap-2' },
                      e('button', { onClick: handleExportExcel, className: 'bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold' }, 'تصدير Excel'),
                      e('button', { onClick: handleExportCSV, className: 'bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold' }, 'تصدير CSV'),
                      e('button', { onClick: () => window.print(), className: 'bg-slate-800 hover:bg-slate-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold' }, 'طباعة التقرير PDF'))
                  ),
                  e('div', { className: 'bg-white p-10 rounded-2xl border border-slate-200 shadow-sm space-y-8' },
                    e('div', { className: 'border-b border-slate-200 pb-4' },
                      e('h2', { className: 'text-2xl font-extrabold text-slate-900 mb-1' }, 'تقرير تحليل البيانات الشامل'),
                      e('p', { className: 'text-xs text-slate-500' }, `اسم الملف: ${activeDataset.fileName} • تاريخ التقرير: ${new Date().toLocaleDateString('ar-SA')}`)),
                    e('div', { className: 'space-y-2' },
                      e('h4', { className: 'font-bold text-slate-800 border-r-4 border-teal-600 pr-2' }, '1. الملخص التنفيذي والجودة'),
                      e('p', { className: 'text-xs text-slate-600 leading-relaxed' },
                        `يحتوي هذا التقرير على تحليل شامل لـ ${activeDataset.rowCount} سجل عبر ${activeDataset.columnCount} أعمدة. وصل مؤشر جودة البيانات الإجمالي إلى ${activeDataset.qualityScore}% مع وجود ${activeDataset.totalMissing} قيمة مفقودة و${activeDataset.duplicatesCount} سجل مكرر.`)),
                    e('div', { className: 'space-y-3' },
                      e('h4', { className: 'font-bold text-slate-800 border-r-4 border-teal-600 pr-2' }, '2. الإحصائيات الوصفية الدقيقة للأعمدة الرقمية'),
                      e('div', { className: 'overflow-x-auto' },
                        e('table', { className: 'w-full text-right border-collapse text-xs' },
                          e('thead', { className: 'bg-slate-100 font-bold' },
                            e('tr', null, ...['العمود', 'المجموع', 'المتوسط (Mean)', 'الوسيط (Median)', 'الانحراف المعياري', 'القيم الشاذة'].map(t => e('th', { key: t, className: 'p-2' }, t)))),
                          e('tbody', { className: 'divide-y divide-slate-100' },
                            activeDataset.columns.filter(c => c.type === 'number' && c.stats).map(c => e('tr', { key: c.name },
                              e('td', { className: 'p-2 font-bold' }, c.name),
                              e('td', { className: 'p-2' }, c.stats.sum.toLocaleString('ar-SA')),
                              e('td', { className: 'p-2' }, c.stats.mean.toFixed(2)),
                              e('td', { className: 'p-2' }, c.stats.median.toFixed(2)),
                              e('td', { className: 'p-2' }, c.stats.stdDev.toFixed(2)),
                              e('td', { className: 'p-2 text-amber-600 font-bold' }, c.stats.outliersCount)
                            ))
                          )
                        )
                      )
                    )
                  )
                )
              )
            )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
